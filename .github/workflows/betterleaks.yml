name: Betterleaks secret scan

# Uses the betterleaks CLI directly rather than an action, since gitleaks-action
# requires a paid license for private repositories. The CLI is free regardless.
# Betterleaks is a gitleaks successor maintained by the same team: https://github.com/betterleaks/betterleaks
on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            fullHistory:
                description: 'Scan the full git history instead of just new commits'
                default: false
                type: boolean

permissions:
    contents: read

env:
    BETTERLEAKS_VERSION: 1.8.1
    # sha256 of betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz, pinned from
    # https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/checksums.txt
    # so a compromised or corrupted release download still gets caught.
    BETTERLEAKS_SHA256_LINUX_X64: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a

jobs:
    betterleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install betterleaks
              run: |
                  curl -sSL -o betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
                  echo "${BETTERLEAKS_SHA256_LINUX_X64}  betterleaks.tar.gz" | sha256sum -c -
                  tar -xzf betterleaks.tar.gz betterleaks
                  chmod +x betterleaks

            - name: Full history scan
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.fullHistory }}
              run: ./betterleaks git . --redact --verbose

            - name: Scan PR commits for secrets
              if: ${{ github.event_name == 'pull_request' }}
              run: ./betterleaks git . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --verbose

            - name: Scan pushed commits for secrets
              if: ${{ github.event_name == 'push' }}
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  AFTER_SHA: ${{ github.event.after }}
              run: |
                  # github.event.before is the all-zero SHA when the ref is newly created,
                  # and can point to a commit our fetch-depth:0 checkout never fetched (it's
                  # only reachable from the ref, so a force-push can orphan it). Either way
                  # the range below would error and skip the scan entirely, so fall back to
                  # scanning full history instead of failing open.
                  ZERO_SHA="0000000000000000000000000000000000000000"
                  if [ "$BEFORE_SHA" = "$ZERO_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                      echo "before-SHA is unusable (new branch or force-push) - scanning full history instead"
                      ./betterleaks git . --redact --verbose
                  else
                      ./betterleaks git . --log-opts="${BEFORE_SHA}..${AFTER_SHA}" --redact --verbose
                  fi

            - name: Manual run, incremental
              if: ${{ github.event_name == 'workflow_dispatch' && !inputs.fullHistory }}
              run: ./betterleaks git . --log-opts="-20" --redact --verbose
